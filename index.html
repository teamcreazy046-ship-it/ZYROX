 const d=modal(`<h3>Depositar USDT</h3><p>Red: <b>BEP20 (BNB Smart Chain)</b><br><small>Mínimo 0.1 USDT. Si envías por otra red perderás los fondos.</small></p><div class=card style="word-break:break-all"><b>${ADDR}</b></div><button class=s id=cp>${ic('copy',14)} Copiar dirección</button><p>Cuando envíes, pega el hash (TxID) de la transferencia:</p><input id=h placeholder="0x..."><button class=b id=go>Verificar y acreditar</button>`);
 $('#cp',d).onclick=()=>{navigator.clipboard.writeText(ADDR);alert('Copiado')};
 $('#go',d).onclick=async e=>{const hash=$('#h',d).value.trim(),b=e.target;
  if(!/^0x[0-9a-fA-F]{64}$/.test(hash))return alert('El hash debe empezar por 0x y tener 66 caracteres');
  b.disabled=true;b.textContent='Verificando en la red...';
  const{data,error}=await fn({a:'deposit',hash});b.disabled=false;b.textContent='Verificar y acreditar';
  if(error||data?.error)return alert(data?.error||'Error de conexión');
  d.remove();alert('✅ Acreditado: '+data.usd+' USDT');wallet()}}

// ---------- PERFIL ----------
function prof(){
 const link=location.origin+location.pathname+'?ref='+U.phone;
 $('#m').innerHTML=`<div class=card><b>${E(U.name)}</b><br>${ic('phone',16)} ${E(U.phone)}<br>${ic('coin',16)} ${money(U.balance)} USDT<br><small>Miembro desde ${new Date(U.created_at).toLocaleDateString()}</small></div><button class=b id=pw>${ic('lock',16)} Cambiar contraseña</button><div class=card><b>Soporte</b>${wa()}</div><div class=card><b>${ic('gift',18)} Invita y gana</b><br><small>Recibes el 5% del primer depósito de cada persona que invites.</small><input readonly value="${E(link)}"><button class=b id=cp>${ic('copy',16)} Copiar enlace</button></div><button class="b red" id=lo>${ic('logout',16)} Cerrar sesión</button>`;
 $('#pw').onclick=async()=>{const w=prompt('Nueva contraseña (mín. 6)');if(!w||w.length<6)return;const{error}=await sb.auth.updateUser({password:w});alert(error?'Error':'✅ Contraseña cambiada')};
 $('#cp').onclick=()=>{navigator.clipboard.writeText(link);alert('Copiado')};
 $('#lo').onclick=async()=>{await sb.auth.signOut();location.reload()}}

// ---------- ADMIN ----------
async function admin(){
 const T=[['users','Clientes'],['ord','Pedidos'],['dep','Depósitos'],['cfg','Ajustes']];
 $('#m').innerHTML=`<div class=tabs>${T.map(x=>`<button class="${x[0]==at?'on':''}" onclick="at='${x[0]}';admin()">${x[1]}</button>`).join('')}</div><div id=ad></div>`;
 await A_[at]($('#ad'));badge()}
const A_={
 async users(ad){
  const{data}=await sb.from('profiles').select().order('created_at',{ascending:false});
  ad.innerHTML=`<h3>Clientes: ${data.length}</h3><input id=q placeholder="Buscar por nombre o número"><div id=ul></div>
  <div class=card><b>Créditos</b><input id=cph placeholder="Número del cliente"><input id=cam type=number step=0.01 placeholder="USDT"><button class=b onclick="W.cr(1)">Enviar</button><button class="b red" onclick="W.cr(-1)">Quitar</button></div>
  <div class=card><b>Aviso a todos</b><textarea id=nt></textarea><button class=b onclick="W.nt()">Enviar aviso</button></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase();$('#ul').innerHTML=data.filter(u=>(u.name+u.phone).toLowerCase().includes(q)).map(u=>`<div class=card>${E(u.name)} · ${u.phone}${u.is_admin?ic('crown',16):''}${u.banned?ic('ban',16):''}<br>${ic('coin',16)} ${money(u.balance)} USDT${u.phone==ADMIN?'':`<br><button class=s onclick="W.au('${u.phone}','admin')">${u.is_admin?'Quitar admin':'Hacer admin'}</button><button class="s red" onclick="W.au('${u.phone}','ban')">${u.banned?'Desbanear':'Banear'}</button>`}</div>`).join('')};
  $('#q').oninput=draw;draw()},
 async ord(ad){await fn({a:'sync',all:1});
  const{data}=await sb.from('orders').select('*,profiles(name,phone)').order('id',{ascending:false});
  ad.innerHTML=`<h3>Pedidos (${data.length})</h3>`+data.map(o=>`<div class=card><b>#${o.id} ${E(o.game)} ${E(o.region)}</b> · ${E(o.label)}<br>${money(o.price)} USDT · ID jugador: <b>${E(o.player_id)}</b><br>${ic('user',16)} ${E(o.profiles?.name)} · ${o.profiles?.phone}<br>${st(o.status)} <small>${dt(o.created_at)}</small>${o.status=='pending'?`<br><button class=s onclick="W.ao(${o.id},true)">Aceptar</button><button class="s red" onclick="W.ao(${o.id},false)">Rechazar</button>`:''}</div>`).join('')},
 async dep(ad){
  const{data}=await sb.from('deposits').select('*,profiles(name,phone)').order('id',{ascending:false});
  ad.innerHTML=`<h3>Depósitos (${data.length})</h3>`+data.map(d=>`<div class=card><b>#${d.id} ${money(d.usd)} USDT</b><br>${ic('user',16)} ${E(d.profiles?.name)} · ${d.profiles?.phone}<br>Hash: <small style="word-break:break-all">${E(d.tx_hash||'')}</small><br>${st(d.status)} <small>${dt(d.created_at)}</small>${d.status=='pending'?`<br><button class=s onclick="W.ad(${d.id},true)">Acreditar</button><button class="s red" onclick="W.ad(${d.id},false)">Rechazar</button>`:''}</div>`).join('')},
 async cfg(ad){
  const[{data:pn},_]=await Promise.all([sb.from('pay_numbers').select().order('pos'),loadData()]);
  ad.innerHTML=`<button class=b onclick="W.cat()">Ver catálogo Play Zone (IDs)</button>
  <div class=card><b>Números de soporte (WhatsApp)</b>${sup().map((n,i)=>`<div class=row><span style="flex:1">${E(n)}</span><button class=s onclick="W.se(${i})">${ic('edit',14)}</button><button class=s onclick="W.sd(${i})">${ic('trash',14)}</button></div>`).join('')}<button class=s onclick="W.sa()">${ic('plus',14)} Añadir número</button></div>
  <div class=card><b>Juegos y ofertas</b>${G.map(g=>`<div class=card style="background:var(--bg)"><b>${E(g.name)}</b> <button class=s onclick="W.gd(${g.id})">Quitar juego</button>${O.filter(o=>o.game_id==g.id).map(o=>`<div class=row><span style="flex:1">${E(o.label)} · ${money(o.price)} USDT · PZ ${o.pz||'sin ID'}</span><button class=s onclick="W.oe(${o.id})">${ic('edit',16)}</button><button class=s onclick="W.od(${o.id})">${ic('trash',16)}</button></div>`).join('')}<button class=s onclick="W.oa(${g.id})">+ Oferta</button></div>`).join('')}<button class=b onclick="W.ga()">+ Añadir juego</button></div>`}};
const rl=async(f)=>{await f;admin()};
W.ao=(i,ok)=>rl(sb.rpc('admin_order',{i,ok}));
W.ad=(i,ok)=>rl(sb.rpc('admin_deposit',{i,ok}));
W.au=async(ph,act)=>{const r=await sb.rpc('admin_user',{ph,act});r.error&&alert(r.error.message);admin()};
W.cr=async s=>{const ph=$('#cph').value.trim(),a=parseFloat($('#cam').value);if(!ph||!(a>0))return alert('Número y monto');await sb.rpc('admin_credit',{ph,amt:a*s});alert('Hecho');admin()};
W.nt=async()=>{const text=$('#nt').value.trim();if(!text)return;await sb.from('notices').insert({text});alert('Aviso enviado');admin()};
W.rate=async()=>{await sb.from('settings').upsert({key:'rate',value:String($('#rt').value)});alert('Guardado');admin()};
W.pn=async()=>{for(const r of document.querySelectorAll('.pr')){const[a,b,c]=r.querySelectorAll('input');await sb.from('pay_numbers').update({num:a.value.trim(),max_dep:+b.value,pos:+c.value}).eq('id',r.dataset.i)}alert('Guardado')};
W.pa=async()=>{const num=prompt('Número');if(num)rl(sb.from('pay_numbers').insert({num,max_dep:3,pos:99}))};
W.pd=i=>rl(sb.from('pay_numbers').delete().eq('id',i));
W.ga=()=>{const name=prompt('Nombre del juego');if(name)rl(sb.from('games').insert({name,img:prompt('URL de imagen (opcional)')||null}))};
W.gd=i=>confirm('¿Quitar juego y sus ofertas?')&&rl(sb.from('games').delete().eq('id',i));
W.oa=g=>{const label=prompt('Oferta (ej: 110 diamantes)'),price=parseFloat(prompt('Precio en USDT')),pz=parseInt(prompt('ID del producto en Play Zone (ver catálogo)'));if(label&&price)rl(sb.from('offers').insert({game_id:g,label,price,pz:pz||null}))};
W.oe=i=>{const price=parseFloat(prompt('Precio en USDT (vacío = no cambiar)')),pz=parseInt(prompt('ID del producto en Play Zone (vacío = no cambiar)')),u={};if(price)u.price=price;if(pz)u.pz=pz;rl(sb.from('offers').update(u).eq('id',i))};
W.od=i=>rl(sb.from('offers').delete().eq('id',i));
const setSup=async a=>{await sb.from('settings').upsert({key:'support',value:a.join(',')});S.support=a.join(',');admin()};
W.sa=()=>{const n=(prompt('Número de WhatsApp (ej: 53975065)')||'').replace(/\D/g,'');if(n)setSup([...sup(),n])};
W.se=i=>{const n=(prompt('Nuevo número',sup()[i])||'').replace(/\D/g,'');if(n){const a=sup();a[i]=n;setSup(a)}};
W.sd=i=>setSup(sup().filter((_,k)=>k!=i));
let RT=0;
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);o.start();o.stop(c.currentTime+.6)}catch(e){}}
function toast(t,x){const d=document.createElement('div');d.className='toast';d.innerHTML=`${ic('bell',24)}<div><b>${t}</b><br><small>${E(x)}</small></div>`;d.onclick=()=>{d.remove();tab='admin';at=t.includes('depósito')?'dep':'ord';shell()};document.body.append(d);setTimeout(()=>d.remove(),9000);beep();navigator.vibrate&&navigator.vibrate([200,100,200])}
async function badge(){const q=t=>sb.from(t).select('id',{count:'exact',head:true}).eq('status','pending');const[a,b]=await Promise.all([q('orders'),q('deposits')]);const n=(a.count||0)+(b.count||0),el=$('nav [data-t=admin]');if(!el)return;$('.bd',el)?.remove();if(n)el.insertAdjacentHTML('beforeend',`<i class=bd>${n}</i>`)}
function listen(){if(RT)return;RT=1;
 const f=(tb,t)=>sb.channel(tb).on('postgres_changes',{event:'INSERT',schema:'public',table:tb},p=>{const r=p.new;toast(t,tb=='orders'?`${r.game} · ${r.label} · ${money(r.price)} USDT`:`${money(r.usd)} USDT · automático`);badge();if(tab=='admin'&&(at=='ord'||at=='dep'))admin()}).subscribe();
 f('orders','Nuevo pedido');f('deposits','Nuevo depósito')}
W.cat=async()=>{const{data}=await fn({a:'catalog'});if(!data?.Categorias)return alert(data?.error||data?.Error||'No se pudo cargar el catálogo');
 const L=data.Categorias.flatMap(c=>c.Productos.map(p=>({...p,c:c.Categoria_name})));
 const d=modal(`<h3>Catálogo Play Zone</h3><input id=q placeholder="Buscar (ej: free fire)"><div id=cl></div>`);
 const dr=()=>{const q=$('#q',d).value.toLowerCase();$('#cl',d).innerHTML=L.filter(p=>(p.c+' '+p.Name).toLowerCase().includes(q)).slice(0,50).map(p=>`<div class=card><b>ID ${p.id}</b> · ${E(p.c)}<br>${E(p.Name)} · base ${p.Precio} USDT<br><small>Pide: ${E((p.Requerido||[]).join(', '))}</small></div>`).join('')};
 $('#q',d).oninput=dr;dr()};
boot();
</script></body></html>
