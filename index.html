<style>

body.light{--bg:#f3f3fa;--c:#fff;--t:#16162a;--m:#666}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif}
header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--c);z-index:5}

input,textarea,select{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #8884;background:var(--bg);color:var(--t);font:inherit}
.b{width:100%;padding:12px;margin:5px 0;border:0;border-radius:10px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff;font-weight:700;font-size:15px}
.red{background:#dc2626}.s{padding:6px 10px;border:0;border-radius:8px;background:var(--a);color:#fff;margin:4px 4px 0 0}
.link{background:none;border:0;color:var(--a);padding:6px 0;font-size:15px}a{color:var(--a)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{background:var(--c);border:0;border-radius:16px;padding:16px;color:var(--t);font-size:44px;display:flex;flex-direction:column;align-items:center;gap:6px}.game img{width:100%;height:90px;object-fit:cover;border-radius:12px}.game b{font-size:14px}
.b2{display:flex;justify-content:space-between;width:100%;border:0;color:var(--t);font-size:15px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.box{background:var(--c);border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.full{background:var(--bg)}.st{text-align:center;width:100%;max-width:420px}.st.ok{color:#22c55e}.st.no{color:#ef4444}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{border:0;border-radius:8px;padding:8px 12px;background:var(--c);color:var(--t)}.tabs .on{background:var(--a);color:#fff}
.stars span{font-size:30px;color:#888;cursor:pointer}.stars .on{color:#facc15}
.wa{display:block;text-align:center;background:#25d366;color:#fff;padding:12px;border-radius:10px;margin:6px 0;text-decoration:none;font-weight:700}
.row{display:flex;gap:4px;align-items:center}.p{width:100%;border-radius:10px}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
</style></head><body><div id="app"></div>

<script>

function authView(reg){
 A.innerHTML=`<div class=auth><div class="box c"><h1 class=logo>ZYROX</h1><p>Recargas de videojuegos 🇨🇺</p>${reg?'<input id=n placeholder="Nombre">':''}<input id=p type=tel placeholder="Número (ej: 53975065)"><input id=w type=password placeholder="Contraseña"><button class=b id=go>${reg?'Crear cuenta':'Iniciar sesión'}</button><button class=link id=sw>${reg?'Ya tengo cuenta':'Crear una cuenta'}</button></div></div>`;

  if(reg){const n=$('#n').value.trim();if(!n)return alert('Pon tu nombre');

async function loadData(){

function shell(){

 if(U.is_admin&&U.phone==ADMIN||U.is_admin)t.push(['admin','⚙️','Admin']);
 A.innerHTML=`<header><h1 class=logo>ZYROX</h1><span><button class=r id=th>🌓</button><button class=r id=cr>💲</button><button class=r id=sh>🛒</button></span></header><main id=m></main><nav>${t.map(x=>`<button data-t=${x[0]} class="${x[0]==tab?'on':''}">${x[1]}<small>${x[2]}</small></button>`).join('')}</nav>`;

 $('#cr').onclick=()=>modal(`<div class=c><small>Tus créditos</small><h1>${money(U.balance)} USD</h1></div>`);
 $('#sh').onclick=()=>{tab='home';sel={};shell()};
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});
 ({home,orders,wallet,prof,admin})[tab]()}

// ---------- INICIO ----------
async function home(){
 const[{data:n},{data:rv}]=await Promise.all([sb.from('notices').select().order('id',{ascending:false}).limit(1),sb.from('reviews').select().order('id',{ascending:false}).limit(6)]);
 let h=n&&n[0]?`<div class=card>📢 ${E(n[0].text)}</div>`:'';

 if(!g)h+=`<h3>Elige un juego</h3><div class=grid>${G.map(x=>`<button class=game onclick="W.g(${x.id})">${x.img?`<img src="${E(x.img)}">`:'🔥'}<b>${E(x.name)}</b></button>`).join('')}</div>`;
 else if(!sel.r)h+=`<button class=link onclick="W.g()">← Volver</button><h3>${E(g.name)}</h3><p>Elige la región</p><button class=b onclick="W.r()">${E(g.region)}</button>`;
 else h+=`<button class=link onclick="W.g()">← Volver</button><h3>${E(g.name)} · ${E(g.region)}</h3>${O.filter(o=>o.game_id==g.id).map(o=>`<button class="card b2" onclick="W.o(${o.id})"><span>💎 ${E(o.label)}</span><b>${money(o.price)} USD</b></button>`).join('')}`;
 h+=`<h3>Deja tu reseña</h3><div class=card><div class=stars id=sr>${[1,2,3,4,5].map(i=>`<span data-i=${i} class=on>★</span>`).join('')}</div><textarea id=cm placeholder="Tu comentario"></textarea><button class=b id=rv>Enviar reseña</button></div>${(rv||[]).map(r=>`<div class=card><span style="color:#facc15">${'★'.repeat(r.stars)}</span> <b>${E(r.name)}</b><br>${E(r.text)}</div>`).join('')}<h3>Soporte</h3>${wa}`;
 $('#m').innerHTML=h;
 let rate=5;
 $('#sr').onclick=e=>{const i=+e.target.dataset.i;if(!i)return;rate=i;[...$('#sr').children].forEach((s,k)=>s.classList.toggle('on',k<i))};
 $('#rv').onclick=async()=>{const text=$('#cm').value.trim();if(!text)return alert('Escribe un comentario');
  const{error}=await sb.from('reviews').insert({user_id:U.id,name:U.name,stars:rate,text});if(error)return alert('Error');home()}}
W.g=id=>{sel=id?{g:id}:{};home()};W.r=()=>{sel.r=1;home()};
W.o=id=>offer(O.find(x=>x.id==id));

function offer(o){
 const g=G.find(x=>x.id==o.game_id);
 const d=modal(`<h3>Tu pedido</h3><p>🎮 ${E(g.name)} · ${E(g.region)}<br>💎 ${E(o.label)}<br>💵 <b>${money(o.price)} USD</b></p><input id=pid placeholder="ID de jugador de Free Fire"><button class=b id=pay>Pagar</button>`);

  const pid=$('#pid',d).value.trim();if(!pid)return alert('Pon tu ID de jugador');
  if(Number(U.balance)<Number(o.price))return alert('❌ No tienes crédito suficiente. Deposita en Wallet.');
  const{data,error}=await sb.rpc('place_order',{o:o.id,pid});
  if(error)return alert(/saldo/.test(error.message)?'❌ No tienes crédito suficiente':'Error al pagar');
  d.remove();U.balance-=o.price;track(data,o,pid,g)}}

function track(id,o,pid,g){
 const d=document.createElement('div');d.className='ov full';
 const body=(t,c)=>`<div class="st ${c}"><h1>${t}</h1><p style="color:var(--t)">🎮 ${E(g.name)} · ${E(g.region)}<br>💎 ${E(o.label)} · ${money(o.price)} USD<br>ID: ${E(pid)}<br>Pedido #${id}</p><button class=b id=mn>${c?'Cerrar':'Minimizar'}</button></div>`;

 set('⏳ Tu pedido está siendo procesado','');document.body.append(d);
 const iv=setInterval(async()=>{
  const{data}=await sb.from('orders').select('status').eq('id',id).single();
  if(data&&data.status!='pending'){clearInterval(iv);const ok=data.status=='done';set(ok?'✅ Realizado':'❌ Rechazado',ok?'ok':'no');d.style.display='';refreshU()}},3000)}

function dep2(usd,num){

function dep3(usd){
 const d=modal(`<h3>Comprobante</h3><p>Sube la captura:</p><input id=f type=file accept="image/*"><input id=ph type=tel placeholder="Número desde el que enviaste"><button class=b id=en>Enviar a revisión</button>`);
 $('#en',d).onclick=async()=>{
  const f=$('#f',d).files[0],ph=$('#ph',d).value.trim();if(!f||!ph)return alert('Sube la captura y pon tu número');
  const proof=await new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,800/i.width);c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.src=URL.createObjectURL(f)});
  const{error}=await sb.rpc('create_deposit',{amt:usd,fp:ph,pr:proof});
  if(error)return alert('Error: '+error.message);
  d.remove();alert('✅ Enviado a revisión');wallet()}}

  ad.innerHTML=`<h3>Pedidos (${data.length})</h3>`+data.map(o=>`<div class=card><b>#${o.id} ${E(o.game)} ${E(o.region)}</b> · ${E(o.label)}<br>${money(o.price)} USD · ID jugador: <b>${E(o.player_id)}</b><br>👤 ${E(o.profiles?.name)} · ${o.profiles?.phone}<br>${st(o.status)} <small>${dt(o.created_at)}</small>${o.status=='pending'?`<br><button class=s onclick="W.ao(${o.id},true)">Aceptar</button><button class="s red" onclick="W.ao(${o.id},false)">Rechazar</button>`:''}</div>`).join('')},
 async dep(ad){

  ad.innerHTML=`<h3>Depósitos (${data.length})</h3>`+data.map(d=>`<div class=card><b>#${d.id} ${money(d.usd)} USD</b> (${d.cup} Saldo Móvil)<br>👤 ${E(d.profiles?.name)} · ${d.profiles?.phone}<br>Envió desde: ${E(d.from_phone)} → a ${E(d.pay_num)}<br>${st(d.status)} <small>${dt(d.created_at)}</small><br><img class=p src="${E(d.proof)}">${d.status=='pending'?`<br><button class=s onclick="W.ad(${d.id},true)">Acreditar</button><button class="s red" onclick="W.ad(${d.id},false)">Rechazar</button>`:''}</div>`).join('')},
 async cfg(ad){

  <div class=card><b>Juegos y ofertas</b>${G.map(g=>`<div class=card style="background:var(--bg)"><b>${E(g.name)}</b> <button class=s onclick="W.gd(${g.id})">Quitar juego</button>${O.filter(o=>o.game_id==g.id).map(o=>`<div class=row><span style="flex:1">${E(o.label)} · ${money(o.price)} USD</span><button class=s onclick="W.oe(${o.id})">✏️</button><button class=s onclick="W.od(${o.id})">🗑</button></div>`).join('')}<button class=s onclick="W.oa(${g.id})">+ Oferta</button></div>`).join('')}<button class=b onclick="W.ga()">+ Añadir juego</button></div>`}};
const rl=async(f)=>{await f;admin()};

W.pn=async()=>{for(const r of document.querySelectorAll('.pr')){const[a,b,c]=r.querySelectorAll('input');await sb.from('pay_numbers').update({num:a.value.trim(),max_dep:+b.value,pos:+c.value}).eq('id',r.dataset.i)}alert('Guardado')};
W.pa=async()=>{const num=prompt('Número');if(num)rl(sb.from('pay_numbers').insert({num,max_dep:3,pos:99}))};
W.pd=i=>rl(sb.from('pay_numbers').delete().eq('id',i));
W.ga=()=>{const name=prompt('Nombre del juego');if(name)rl(sb.from('games').insert({name,img:prompt('URL de imagen (opcional)')||null}))};
W.gd=i=>confirm('¿Quitar juego y sus ofertas?')&&rl(sb.from('games').delete().eq('id',i));
W.oa=g=>{const label=prompt('Oferta (ej: 110 diamantes)'),price=parseFloat(prompt('Precio USD'));if(label&&price)rl(sb.from('offers').insert({game_id:g,label,price}))};
W.oe=i=>{const price=parseFloat(prompt('Nuevo precio USD'));if(price)rl(sb.from('offers').update({price}).eq('id',i))};
W.od=i=>rl(sb.from('offers').delete().eq('id',i));
boot();
</script></body></html>
